<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coordinate Point Editor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
    #app { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
    #sidebar {
      width: 20%; min-width: 245px; max-width: 440px; padding: 14px;
      display: flex; flex-direction: column; gap: 10px; border-right: 1px solid #d5dbe3;
      background: #f7f9fc;
    }
    h1 { font-size: 17px; margin: 0; font-weight: 650; }
    .hint { color: #596579; font-size: 12px; margin: 0; }
    #points {
      flex: 1; width: 100%; min-height: 120px; resize: none; padding: 10px;
      border: 1px solid #cbd3df; border-radius: 8px; background: white;
      color: #172033; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre; tab-size: 2; outline: none;
    }
    #points:focus { border-color: #3979d6; box-shadow: 0 0 0 2px #3979d61c; }
    .buttons { display: flex; gap: 7px; flex-wrap: wrap; }
    button {
      border: 1px solid #cbd3df; background: white; color: #172033; border-radius: 7px;
      padding: 7px 10px; cursor: pointer; font: inherit;
    }
    button:hover { background: #edf3fb; }
    button.primary { background: #245fbd; border-color: #245fbd; color: white; }
    button.primary:hover { background: #1d4f9e; }
    #status { font-size: 12px; color: #526075; min-height: 18px; }
    #map { flex: 1; min-width: 0; height: 100%; background: #e8eef4; }
    .leaflet-tooltip.point-label { border: 0; box-shadow: none; background: #172033; color: white; padding: 2px 5px; border-radius: 4px; }
    @media (max-width: 700px) {
      #app { flex-direction: column; }
      #sidebar { width: 100%; max-width: none; min-width: 0; height: 38%; min-height: 220px; }
      #map { height: 62%; }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1>Coordinate point editor</h1>
      <p class="hint">Enter one [latitude, longitude] pair per line. Drag map markers to update the list. The first and last points can match to close a polygon.</p>
      <textarea id="points" spellcheck="false" aria-label="Coordinate points"></textarea>
      <div class="buttons">
        <button class="primary" id="plot">Plot points</button>
        <button id="fit">Fit map</button>
        <button id="copy">Copy points</button>
        <button id="reset">Reset</button>
      </div>
      <div id="status" role="status">Loading points…</div>
    </aside>
    <main id="map" aria-label="Map with editable coordinate points"></main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const initialPoints = [
      [53.0855, 16.6484],
      [52.3278, 16.2937],
      [52.2177, 15.6554],
      [51.6038, 15.3367],
      [50.5269, 15.0384],
      [50.1669, 14.8511],
      [49.3497, 14.638],
      [48.6683, 14.0503],
      [47.9901, 14.0481],
      [47.4077, 13.6614],
      [46.7889, 13.4657],
      [45.6574, 13.3387],
      [45.0386, 12.8158],
      [44.6178, 12.8171],
      [43.9298, 12.6165],
      [43.4752, 12.8389],
      [43.232, 13.2672],
      [43.2826, 13.6397],
      [43.089, 14.0108],
      [43.0211, 14.555],
      [42.7171, 15.6545],
      [42.7992, 16.3718],
      [43.1649, 16.6892],
      [43.1911, 17.3595],
      [43.418, 17.5162],
      [43.9169, 17.3249],
      [44.1557, 17.3986],
      [45.1483, 17.4274],
      [45.4066, 17.32],
      [46.3104, 17.2312],
      [46.6819, 17.2685],
      [46.9758, 16.9533],
      [47.4418, 17.1118],
      [47.5795, 17.4483],
      [48.172, 18.1567],
      [49.0421, 18.582],
      [51.9775, 18.9961],
      [52.729, 17.3005],
      [53.0855, 16.6484]
    ];

    const textarea = document.getElementById('points');
    const status = document.getElementById('status');
    const map = L.map('map', { preferCanvas: true });


    let markers = [];
    let shape = null;
    let parsedPoints = [];
    let updateTimer = null;

    function formatPoints(points) {
      return points.map(([lat, lng]) => `    [${Number(lat.toFixed(6))}, ${Number(lng.toFixed(6))}]`).join(',\n');
    }

    function parsePoints(text) {
      // Accepts pairs such as [53.0855, 16.6484], with or without outer brackets/commas.
      const points = [];
      const pairPattern = /\[?\s*(-?\d+(?:\.\d+)?(?:e[+-]?\d+)?)\s*,\s*(-?\d+(?:\.\d+)?(?:e[+-]?\d+)?)\s*\]?/gi;
      let match;
      while ((match = pairPattern.exec(text)) !== null) {
        const lat = Number(match[1]), lng = Number(match[2]);
        if (!Number.isFinite(lat) || !Number.isFinite(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) {
          throw new Error(`Invalid latitude/longitude near "${match[0]}"`);
        }
        points.push([lat, lng]);
      }
      if (points.length === 0) throw new Error('Enter at least one coordinate pair.');
      return points;
    }

    function clearLayers() {
      markers.forEach(marker => map.removeLayer(marker));
      markers = [];
      if (shape) { map.removeLayer(shape); shape = null; }
    }

    function renderPoints(points, shouldFit = false) {
      clearLayers();
      parsedPoints = points.map(p => [...p]);

      points.forEach((point, index) => {
        const marker = L.circleMarker(point, {
          radius: 5, color: '#ffffff', weight: 1.5, fillColor: '#1769d2', fillOpacity: 1
        }).addTo(map);
        marker.bindTooltip(String(index + 1), { permanent: false, direction: 'top', className: 'point-label' });
        marker.bindPopup(`Point ${index + 1}<br>${point[0]}, ${point[1]}<br><small>Drag to edit</small>`);
        marker.on('mousedown', () => map.dragging.disable());
        marker.on('mouseup', () => map.dragging.enable());
        marker.on('dragend', () => {});
        // circleMarker is made draggable using a small transparent draggable marker overlay.
        const dragHandle = L.marker(point, {
          draggable: true,
          opacity: 0,
          interactive: true,
          keyboard: false,
          icon: L.divIcon({ className: 'drag-handle', html: '<div style="width:20px;height:20px;margin:-10px;border-radius:50%;"></div>', iconSize: [20, 20] })
        }).addTo(map);
        dragHandle.on('drag', () => marker.setLatLng(dragHandle.getLatLng()));
        dragHandle.on('dragend', () => {
          const ll = dragHandle.getLatLng();
          parsedPoints[index] = [ll.lat, ll.lng];
          textarea.value = formatPoints(parsedPoints);
          updateShapeOnly();
          status.textContent = `${parsedPoints.length} points · point ${index + 1} moved`;
        });
        markers.push(marker, dragHandle);
      });

      if (points.length >= 2) {
        const isClosed = points.length >= 4 &&
          Math.abs(points[0][0] - points[points.length - 1][0]) < 1e-7 &&
          Math.abs(points[0][1] - points[points.length - 1][1]) < 1e-7;
        if (isClosed) {
          shape = L.polygon(points, { color: '#1769d2', weight: 2, fillColor: '#3b82f6', fillOpacity: 0.18 }).addTo(map);
        } else {
          shape = L.polyline(points, { color: '#1769d2', weight: 2 }).addTo(map);
        }
      }

      status.textContent = `${points.length} point${points.length === 1 ? '' : 's'} plotted`;
      if (shouldFit && points.length) {
        const bounds = L.latLngBounds(points);
        if (points.length === 1) map.setView(points[0], 8);
        else map.fitBounds(bounds.pad(0.12));
      }
    }

    function updateShapeOnly() {
      if (shape) map.removeLayer(shape);
      shape = null;
      if (parsedPoints.length >= 2) {
        const p = parsedPoints;
        const isClosed = p.length >= 4 &&
          Math.abs(p[0][0] - p[p.length - 1][0]) < 1e-7 &&
          Math.abs(p[0][1] - p[p.length - 1][1]) < 1e-7;
        shape = isClosed
          ? L.polygon(p, { color: '#1769d2', weight: 2, fillColor: '#3b82f6', fillOpacity: 0.18 }).addTo(map)
          : L.polyline(p, { color: '#1769d2', weight: 2 }).addTo(map);
      }
    }

    function plotFromTextarea(fit = false) {
      try {
        const points = parsePoints(textarea.value);
        textarea.value = formatPoints(points);
        renderPoints(points, fit);
      } catch (error) {
        status.textContent = error.message;
      }
    }

    textarea.value = formatPoints(initialPoints);
    renderPoints(initialPoints, true);

    document.getElementById('plot').addEventListener('click', () => plotFromTextarea(false));
    document.getElementById('fit').addEventListener('click', () => {
      plotFromTextarea(true);
    });
    document.getElementById('reset').addEventListener('click', () => {
      textarea.value = formatPoints(initialPoints);
      renderPoints(initialPoints, true);
    });
    document.getElementById('copy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(textarea.value);
        status.textContent = 'Coordinate list copied to clipboard';
      } catch {
        textarea.focus();
        textarea.select();
        status.textContent = 'Select the text and copy it manually';
      }
    });

    // Update the map as the user types, after a short pause.
    textarea.addEventListener('input', () => {
      clearTimeout(updateTimer);
      updateTimer = setTimeout(() => plotFromTextarea(false), 450);
    });

    window.addEventListener('resize', () => map.invalidateSize());
  </script>
</body>
</html>
