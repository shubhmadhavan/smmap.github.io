<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Shubh Madhavan's Map Repository – interactive maps of Indian and world geography, resources and history">
  <meta name="robots" content="index,follow">
  <meta name="author" content="Shubh Madhavan">
  <meta name="theme-color" content="#19192d">
  <title>Shubh Madhavan's Map Repository</title>

  <link rel="icon" type="image/png" sizes="48x48" href="favicon/favicon-48x48.png">
  <link rel="apple-touch-icon" href="favicon/apple-touch-icon.png">
  <link rel="manifest" href="favicon/site.webmanifest">
  <link rel="stylesheet" href="index-styles-main.css">

  <!-- Low-priority fetch for the next pages -->
  <link rel="prefetch" href="Map_Images/India_OS_dark.jpg" as="image">
  <link rel="prefetch" href="Map_Images/map_tiles/0_0_0.png" as="image">
  <link rel="prefetch" href="Map_Images/map_tiles/1_0_0.png" as="image">
  <link rel="prefetch" href="Map_Images/map_tiles/1_0_1.png" as="image">
  <link rel="prefetch" href="Map_Images/map_tiles/1_1_0.png" as="image">
  <link rel="prefetch" href="Map_Images/map_tiles/1_1_1.png" as="image">
  <link rel="prefetch" href="common/leaflet.js" as="script">
  <link rel="prefetch" href="common/app.css" as="style">
</head>
<body>
  <header class="title-header">
    <h1>[ Shubh Madhavan's Map Repository ]</h1>
  </header>

  <main class="folders">
    <a class="folder" href="index-1.html">
      <span class="folder-icon">
        <img src="img/1.png" alt="" loading="lazy" onerror="this.remove()">
      </span>
      <span class="folder-label">Indian Geography</span>
    </a>

    <a class="folder" href="index-2.html">
      <span class="folder-icon">
        <img src="img/2.png" alt="" loading="lazy" onerror="this.remove()">
      </span>
      <span class="folder-label">World Geography</span>
    </a>

    <a class="folder" href="index-3.html">
      <span class="folder-icon">
        <img src="img/3.png" alt="" loading="lazy" onerror="this.remove()">
      </span>
      <span class="folder-label">Resources &amp; Infra</span>
    </a>

    <a class="folder" href="index-4.html">
      <span class="folder-icon">
        <img src="img/4.png" alt="" loading="lazy" onerror="this.remove()">
      </span>
      <span class="folder-label">Ancient &amp; Medieval History</span>
    </a>

    <a class="folder" href="index-5.html">
      <span class="folder-icon">
        <img src="img/5.png" alt="" loading="lazy" onerror="this.remove()">
      </span>
      <span class="folder-label">Modern History</span>
    </a>
  </main>

  <script>
    // Number-key shortcuts: type 1-5 to open a folder
    (() => {
      const folders = [...document.querySelectorAll('.folder')];
      let buffer = '';
      let timer;

      document.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey || !/^\d$/.test(e.key)) return;

        buffer += e.key;
        clearTimeout(timer);

        timer = setTimeout(() => {
          const target = folders[parseInt(buffer, 10) - 1];
          buffer = '';
          if (!target) return;

          target.classList.add('is-active');
          setTimeout(() => { window.location.href = target.href; }, 410);
          setTimeout(() => target.classList.remove('is-active'), 800);
        }, 200);
      });
    })();
  </script>
</body>
</html>
