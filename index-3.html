  <script>
    (() => {
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
      const resets = [];

      document.querySelectorAll('.zipper-block').forEach((block) => {
        const zipper = block.querySelector('.zipper');
        const handle = zipper.querySelector('.zipper-handle');

        let progress = 0;   // 0 = closed, 1 = fully unzipped
        let busy = false;   // true once the unzip-and-navigate has started
        let drag = null;

        const setProgress = (p) => {
          progress = Math.min(1, Math.max(0, p));
          zipper.style.setProperty('--p', progress.toFixed(3));
        };

        const travel = () => zipper.clientHeight - handle.offsetHeight;

        const finish = () => {
          zipper.classList.add('unzipped');
          window.location.href = block.href;
        };

        const open = () => {
          if (busy) return;
          busy = true;

          if (reduceMotion.matches || progress >= 1) {
            setProgress(1);
            finish();
            return;
          }

          const from = progress;
          const duration = (1 - from) * 650;
          const start = performance.now();

          const frame = (now) => {
            const t = Math.min(1, (now - start) / duration);
            setProgress(from + (1 - from) * t);
            if (t < 1) requestAnimationFrame(frame);
            else finish();
          };
          requestAnimationFrame(frame);
        };

        // Drag the handle (mouse, touch or pen)
        handle.addEventListener('pointerdown', (e) => {
          if (busy || e.button !== 0) return;
          e.preventDefault();
          handle.setPointerCapture(e.pointerId);
          drag = { y: e.clientY, p: progress };
        });

        handle.addEventListener('pointermove', (e) => {
          if (!drag) return;
          // Account for the hover scale so the handle tracks the pointer
          const scale = zipper.getBoundingClientRect().height / zipper.offsetHeight || 1;
          setProgress(drag.p + (e.clientY - drag.y) / (scale * travel()));
          if (progress >= 1) {
            drag = null;
            open();
          }
        });

        const endDrag = () => { drag = null; };
        handle.addEventListener('pointerup', endDrag);
        handle.addEventListener('pointercancel', endDrag);

        // Clicking the card: unzip, then navigate
        block.addEventListener('click', (e) => {
          const modified = e.metaKey || e.ctrlKey || e.shiftKey || e.altKey;
          if (e.defaultPrevented || e.button !== 0 || modified) return; // let the browser handle it
          if (e.target.closest('.zipper-label')) return;                // label goes straight to the link
          e.preventDefault();
          open();
        });

        resets.push(() => {
          busy = false;
          drag = null;
          zipper.classList.remove('unzipped');
          setProgress(0);
        });
      });

      // Back/forward cache: don't show a card stuck in the unzipped state
      window.addEventListener('pageshow', (e) => {
        if (e.persisted) resets.forEach((reset) => reset());
      });
    })();
  </script>
