<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1e1e2f">
  <title>SM-Map · Quiz</title>

  <link rel="icon" type="image/png" sizes="48x48" href="../favicon/favicon-48x48.png">
  <link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png">
  <link rel="manifest" href="../favicon/site.webmanifest">

  <link rel="stylesheet" href="leaflet.css">
  <link rel="stylesheet" href="app.css">
  <link id="themeStylesheet" rel="stylesheet" href="theme1.css">

  <script src="maps.js"></script>
  <script src="leaflet.js" defer></script>
  <script src="core.js" defer></script>
  <script src="quiz.js" defer></script>
</head>
<body class="quiz">

  <div class="top-wrapper">
    <div class="icons-container-left">
      <button class="home-link-button" title="Home (Ctrl+H)"><a class="home-link" href="../index.html">⌂</a></button>
      <button class="switcher-button mode-switch" title="Back to learn mode"><a class="switcher" href="Map_Game_2_dark.html"><span class="switcher-text">⇌</span></a></button>
    </div>

    <div class="icons-container">
      <button class="toggle-map-1" title="Beige map (Ctrl+3)"><img src="../Map_Images/india_icon_1.png" alt="Beige map"></button>
      <button class="toggle-map-3" title="Grey map (Ctrl+1)"><img src="../Map_Images/india_icon_3.png" alt="Grey map"></button>
      <button class="toggle-map-4" title="Green map (Ctrl+2)"><img src="../Map_Images/india_icon_4.png" alt="Green map"></button>
    </div>
  </div>

  <div id="header" title="Find this on the map"></div>
  <div id="map"></div>
  <div id="result" role="status"></div>
  <div id="result2"></div>

  <div class="score-bottom">Score: <span class="correct-ans">0</span>/<span class="items-shown">0</span></div>

  <label><button id="Advance" class="advance_button" title="Skip / next (Space)" aria-label="Skip or next round"></button></label>

  <div class="slider-container">
    <label>
      <span id="auto_next_label" class="auto_next_label">Auto Advance</span> <input type="checkbox" id="auto_next">
      <span class="auto_next_label">ㅤ|ㅤ</span>
    </label>
    <label>
      <span id="do_not_repeat_label" class="do_not_repeat_label">Don't Repeat</span> <input type="checkbox" id="noRepeat" checked>
      <span class="do_not_repeat_label">ㅤ|ㅤ</span>
    </label>
    <label id="slider-label">Next Round: <span id="timeoutValue">1400</span> ms</label>
    <input type="range" id="timeoutSlider" min="500" max="4000" step="100" value="1400">
  </div>

</body>
</html>
